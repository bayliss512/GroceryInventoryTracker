name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # One integration test (MigrationsTests.Migrate_AppliesTheRealMigrationFilesAgainstSqlServer)
    # applies the real, on-disk EF Core migrations against a live SQL Server, since they contain
    # SQL-Server-specific type strings the Sqlite-based tests can't validate. CI provides that
    # server as a service container (the same image docker-compose.yml runs in production) and
    # points the test at it via MIGRATION_TEST_SQLSERVER. GitHub's Windows runners no longer
    # ship SQL Server Express, which is what this job previously relied on.
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that only lives for this job and is reachable only from the runner.
          MSSQL_SA_PASSWORD: "Ci-Only-Pa55word!"
          MSSQL_PID: Express
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only-Pa55word!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      MIGRATION_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Pa55word!;TrustServerCertificate=True;"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore GroceryInventoryTracker.slnx

      - name: Build
        run: dotnet build GroceryInventoryTracker.slnx --no-restore -c Release

      - name: Test
        run: dotnet test GroceryInventoryTracker.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Publish web project
        run: dotnet publish GroceryInventoryTracker/GroceryInventoryTracker.csproj --no-restore -c Release -o publish-output

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: web-publish-output
          path: publish-output

  docker-publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: GroceryInventoryTracker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
